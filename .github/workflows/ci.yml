 name: CI
  on:
    push:
      branches: [main]
    pull_request:
      branches: [main]
  jobs:
    build-test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm
        - run: npm ci
        - name: Typecheck
          run: npm run typecheck
        - name: Test (core + MCP protocol round-trip)
          run: npm test
