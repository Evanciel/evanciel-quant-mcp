<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="quant-mcp">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#121a2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#222838" stroke-width="2"/>

  <!-- subtle grid -->
  <g stroke="#1a2030" stroke-width="1">
    <line x1="60" y1="80" x2="1140" y2="80"/>
    <line x1="60" y1="160" x2="1140" y2="160"/>
    <line x1="60" y1="240" x2="1140" y2="240"/>
  </g>

  <!-- candlesticks (decorative, right side) -->
  <g opacity="0.85">
    <g fill="#10b981" stroke="#10b981">
      <line x1="760" y1="150" x2="760" y2="230" stroke-width="2"/><rect x="753" y="170" width="14" height="45" rx="2"/>
      <line x1="820" y1="120" x2="820" y2="210" stroke-width="2"/><rect x="813" y="140" width="14" height="55" rx="2"/>
      <line x1="940" y1="90"  x2="940" y2="180" stroke-width="2"/><rect x="933" y="105" width="14" height="55" rx="2"/>
      <line x1="1060" y1="60" x2="1060" y2="150" stroke-width="2"/><rect x="1053" y="78" width="14" height="50" rx="2"/>
    </g>
    <g fill="#f43f5e" stroke="#f43f5e">
      <line x1="880" y1="110" x2="880" y2="200" stroke-width="2"/><rect x="873" y="150" width="14" height="40" rx="2"/>
      <line x1="1000" y1="80" x2="1000" y2="170" stroke-width="2"/><rect x="993" y="120" width="14" height="35" rx="2"/>
    </g>
    <!-- trend line -->
    <path d="M 740 210 L 820 175 L 880 185 L 940 140 L 1000 150 L 1060 105 L 1130 92" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="70" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="76" font-weight="800" fill="#e6e6e6">quant<tspan fill="url(#accent)">-mcp</tspan></text>

  <!-- tagline -->
  <text x="72" y="205" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="500" fill="#c9d2e3">Composable backtesting, risk &amp; paper-trading for AI agents</text>
  <text x="72" y="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#8a94a6">over the Model Context Protocol &#183; backtest &#8801; live &#183; risk filter, not alpha source</text>

  <!-- pills -->
  <g font-family="ui-monospace, monospace" font-size="15" font-weight="700">
    <rect x="72" y="262" width="118" height="30" rx="15" fill="rgba(16,185,129,.15)"/><text x="131" y="282" fill="#10b981" text-anchor="middle">22 MCP tools</text>
    <rect x="200" y="262" width="120" height="30" rx="15" fill="rgba(56,189,248,.15)"/><text x="260" y="282" fill="#38bdf8" text-anchor="middle">keyless data</text>
    <rect x="330" y="262" width="92" height="30" rx="15" fill="rgba(168,85,247,.15)"/><text x="376" y="282" fill="#a855f7" text-anchor="middle">MIT</text>
  </g>
</svg>
